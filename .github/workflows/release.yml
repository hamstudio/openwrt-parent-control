name: Build and Release OpenWrt IPK & Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    name: Build IPK Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64
            goarch: arm64
          - arch: arm_cortex-a7_neon-vfpv4
            goarch: arm
          - arch: mips_24kc
            goarch: mips
          - arch: mipsel_24kc
            goarch: mipsle

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build IPK Package
        run: |
          RAW_VER=${GITHUB_REF_NAME#v}
          [ -z "$RAW_VER" ] && RAW_VER="1.0.0"
          if [[ "$RAW_VER" != *-* ]]; then
            VERSION="${RAW_VER}-1"
          else
            VERSION="$RAW_VER"
          fi
          chmod +x scripts/build_ipk.sh
          ./scripts/build_ipk.sh ${{ matrix.arch }} ${VERSION}

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-parentcontrol-${{ matrix.arch }}
          path: dist/*.ipk

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: client/Android

      - name: Grant execute permission for gradlew
        run: chmod +x client/Android/gradlew

      - name: Build Android APK
        working-directory: client/Android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist-apk/ParentControl-Guard-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: parentcontrol-android-apk
          path: dist-apk/*.apk

  release:
    name: Create GitHub Release
    needs: [build-ipk, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Assets
        run: ls -lh release-assets/

      - name: Determine Release Notes
        id: notes
        run: |
          TAG_FILE="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$TAG_FILE" ]; then
            echo "notes_file=$TAG_FILE" >> $GITHUB_OUTPUT
          elif [ -f "docs/releases/v1.0.0.md" ]; then
            echo "notes_file=docs/releases/v1.0.0.md" >> $GITHUB_OUTPUT
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ParentControl Guard ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            release-assets/*.ipk
            release-assets/*.apk
          generate_release_notes: false
