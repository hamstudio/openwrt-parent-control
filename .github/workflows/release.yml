name: Build and Release OpenWrt IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    name: Build IPK Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64
            goarch: arm64
          - arch: arm_cortex-a7_neon-vfpv4
            goarch: arm
          - arch: mips_24kc
            goarch: mips
          - arch: mipsel_24kc
            goarch: mipsle

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build IPK Package
        run: |
          RAW_VER=${GITHUB_REF_NAME#v}
          [ -z "$RAW_VER" ] && RAW_VER="1.0.0"
          if [[ "$RAW_VER" != *-* ]]; then
            VERSION="${RAW_VER}-1"
          else
            VERSION="$RAW_VER"
          fi
          chmod +x scripts/build_ipk.sh
          ./scripts/build_ipk.sh ${{ matrix.arch }} ${VERSION}

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-parentcontrol-${{ matrix.arch }}
          path: dist/*.ipk

  release:
    name: Create GitHub Release
    needs: build-ipk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All IPKs
        uses: actions/download-artifact@v4
        with:
          path: all-ipks
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -la all-ipks/

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: all-ipks/*.ipk
          generate_release_notes: true
