name: ParentControl
options:
  bundleIdPrefix: xyz.hamguy
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

packages:
  ParentControlCore:
    path: ../ParentControlCore

targets:
  ParentControl:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "ParentControl"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "ParentControl needs access to the local network to discover and connect to your router device."
        NSBonjourServices:
          - "_parentcontrol._tcp"
          - "_http._tcp"
          - "_bonjour._tcp"
          - "_lnp._tcp"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: ParentControlCore
        product: ParentControlCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.hamguy.parentcontrol
        PRODUCT_NAME: ParentControl
        DEVELOPMENT_TEAM: 5K6ZR7WYLY
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
